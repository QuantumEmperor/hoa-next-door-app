<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1d2b3a;--mute:#62717f;--line:#dbe2ea;--blue:#2f5d8a;--blueSoft:#dde9f5;--sun:#f2b843;--sunSoft:#fdf1d4;--ok:#2e8b57;--okSoft:#d9f0e3;--warn:#c0562b;--warnSoft:#fbe3d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#e8eef4;--mute:#93a3b3;--line:#2a3846;--blue:#7fb0e0;--blueSoft:#1f3346;--sun:#f2b843;--sunSoft:#3a3117;--ok:#5fc48c;--okSoft:#183526;--warn:#f08a5d;--warnSoft:#3d2418}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18222c;--ink:#e8eef4;--mute:#93a3b3;--line:#2a3846;--blue:#7fb0e0;--blueSoft:#1f3346;--sun:#f2b843;--sunSoft:#3a3117;--ok:#5fc48c;--okSoft:#183526;--warn:#f08a5d;--warnSoft:#3d2418}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 18px 10px;background:var(--blue);color:#fff}
header b{font-size:19px;font-weight:800}
header small{display:block;opacity:.85;font-size:13px}
main{flex:1;overflow-y:auto;padding:14px 14px 20px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0 8px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--blue);font-weight:800}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.official{border-left:5px solid var(--blue)}
.card.urgent{border-left-color:var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-bottom:6px}
.av{width:30px;height:30px;border-radius:50%;background:var(--blueSoft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:13px}
.badge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--blue);color:#fff}
.badge.alert{background:var(--warn)}
.card h3{margin:2px 0 4px;font-size:17px}
.card p{margin:0;font-size:15px}
.meta{margin-top:10px;font-size:13px;color:var(--mute);display:flex;gap:14px;align-items:center}
.meta button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;cursor:pointer;padding:0}
.meta button.liked{color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sun);border-color:var(--sun);color:#1d2b3a;font-weight:800}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunSoft);color:var(--ink)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
label{font-size:14px;font-weight:700;display:block;margin-bottom:4px}
.btn{width:100%;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:800;padding:12px;cursor:pointer}
.btn.light{background:var(--blueSoft);color:var(--blue)}
.steps{display:flex;gap:4px;margin-top:10px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.f{background:var(--ok)}
.st{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px}
.st.open{background:var(--warnSoft);color:var(--warn)}
.st.prog{background:var(--sunSoft);color:var(--ink)}
.st.done{background:var(--okSoft);color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc{display:flex;align-items:center;gap:12px}
.doc .ic{font-size:26px}
.doc small{color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px}
h2{font-size:18px;margin:2px 0 10px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
header{display:flex;align-items:center;gap:12px}
header img{width:46px;height:46px;border-radius:50%;flex:none;background:#fff}
header div{flex:1}
header button{border:1px solid rgba(255,255,255,.55);background:none;color:#fff;font:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;cursor:pointer}
.reg{text-align:center}
.reg img{width:132px;height:132px;border-radius:50%;margin:6px auto 8px;display:block}
.reg h1{font-size:23px;margin:0 0 4px}
.reg p.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.form{text-align:left}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:600;margin:0;cursor:pointer}
input[type=checkbox]{width:auto;margin:0}
.err{color:var(--warn);font-weight:700;font-size:14px;margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pwrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.pwrow input{margin-bottom:0}
.pwtoggle{flex:none;border:1px solid var(--line);background:var(--card);color:var(--blue);font:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:10px 12px;cursor:pointer}
.opt{display:flex;align-items:flex-start;gap:8px;font-weight:600;font-size:15px;margin:0 0 10px;cursor:pointer}
.opt input{flex:none;margin-top:4px}
.opt a,.form a{color:var(--blue);font-weight:800}
.ov{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:430px;transform:translateX(-50%);background:var(--bg);z-index:10;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px))}
.ov h1{font-size:22px;margin:0 0 2px}
.ov h2{font-size:16px;margin:16px 0 4px}
.ov p,.ov li{font-size:15px;margin:0 0 6px}
.ov ul{padding-left:20px;margin:0 0 6px}
</style>
</head>

<p>HOA Next Door is built by the Alaska HOA &amp; Condominium Accountability Project. It gives condo and HOA owners a shared place to see what's happening in their community and log issues neighbors should know about.</p>
<h2>Our mission</h2>
<p>Owning in an HOA or condo association can feel opaque: rules you didn't write, dues you can't fully explain, and decisions made without you in the room. Our mission is to change that.</p>

function showPolicy(){
 if(document.querySelector(".ov"))return;
 var d=document.createElement("div");d.className="ov";d.setAttribute("role","dialog");d.setAttribute("aria-label","Privacy Policy");
 d.innerHTML=`<button class="btn light ppx" style="margin-bottom:14px">Close</button><h1>Privacy Policy</h1><p style="color:var(--mute)">Effective September 25, 2026.</p>
<p>HOA Next Door is operated by the Alaska HOA &amp; Condominium Accountability Project ("we," "us," or "the Project"). This policy explains what we collect through this app, why we collect it, who can see it, and the choices you have. It applies to this app only.</p>
<h2>1. Information we collect</h2>
<p><b>Information you give us directly:</b></p>
<ul><li><b>Account information:</b> your name, email address, the password you choose (stored only in scrambled/encrypted form, never as plain text), your unit number, and your role (owner, renter, or board member).</li>
<li><b>Condo information:</b> the condo or HOA's name, number of units, monthly dues, what the dues cover, who manages the property (including a management company's name, if any), and whether a reserve fund exists.</li>
<li><b>Content you post:</b> anything you write or upload in the community feed or elsewhere in the app.</li>
<li><b>Newsletter preference:</b> whether you opted in to receive it.</li></ul>
<p><b>Information collected automatically:</b></p>
<ul><li>Your device stores a login token and your basic profile locally (in browser storage) so you stay signed in. This stays on your device and is not something we collect on our servers beyond what's described above.</li>
<li>Our hosting providers may log standard technical information (such as IP address and timestamps) as part of normal server operation and security monitoring.</li></ul>
<h2>2. How we use your information</h2>
<p>We use it to: let you log in and stay logged in; operate the features of the app (announcements, community feed, documents); communicate with you about your account or the community; send the optional newsletter, only if you opted in; maintain the security and integrity of the app; and produce anonymous, aggregated statistics about HOA and condo conditions across Alaska (see Section 5).</p>
<h2>3. Who can see your information</h2>
<p>Your name, email address, unit number, and password are private. Only the Project administrator can view this information. We do not sell it, rent it, or share it with advertisers or other third parties for their own marketing purposes.</p>
<p>Other residents of your community can see content you choose to post (such as community feed posts), generally shown with your first name and last initial, not your full account details.</p>
<h2>4. Service providers</h2>
<p>We use third-party companies to operate this app, and your information passes through their systems as part of normal operation: a cloud database provider to store data, a cloud server provider to run the app's backend, and a hosting provider to serve the web pages you see. These providers process data on our behalf under their own security and privacy commitments; they do not have independent rights to use your information for their own purposes.</p>
<h2>5. Condo-level and public information</h2>
<p>Facts about a condo or HOA as an entity (such as unit count, dues, or reserve fund status) are treated differently from information about you personally. We may combine this kind of information across multiple communities and publish aggregated statistics or comparisons in support of the Project's transparency and accountability mission, without identifying individual residents.</p>
<p>We may also reference information that is already publicly available, such as recorded governing documents, corporate filings, or public records. Information that is already public remains public regardless of also appearing here.</p>
<h2>6. Data retention</h2>
<p>We retain your account information for as long as your account is active, or as needed to operate the app. You may request deletion of your account and associated personal information at any time (see Section 9); we will delete it except where we are required or permitted by law to retain it (for example, to resolve disputes or enforce our terms).</p>
<h2>7. Security</h2>
<p>We take reasonable measures to protect your information, including storing passwords only in encrypted (hashed) form, restricting administrative access, and transmitting data over encrypted connections. No system is perfectly secure, and we cannot guarantee absolute security. We may disclose information where required by law, such as in response to a valid subpoena or court order.</p>
<h2>8. Acceptable use</h2>
<p>This app and the information within it may not be used to harass, threaten, stalk, dox, or otherwise harm any person. We reserve the right to suspend or terminate access for anyone who violates this policy or uses the app for such purposes.</p>
<h2>9. Your rights and choices</h2>
<ul><li>You can ask to access, correct, or delete your personal information at any time.</li>
<li>You can unsubscribe from the optional newsletter at any time; this will not affect your ability to use the app.</li>
<li>You can request that your account be closed and your personal information deleted, subject to Section 6.</li></ul>
<p>To exercise any of these choices, contact us at <b>quantumactivist.88@gmail.com</b>.</p>
<h2>10. Children's privacy</h2>
<p>This app is intended for adult residents, owners, and property managers. It is not directed to children, and we do not knowingly collect information from anyone under 18. If we learn that we have done so, we will delete that information.</p>
<h2>11. Changes to this policy</h2>
<p>We may update this policy as the app changes. If we make material changes, we will update the "Effective" date above and, where appropriate, notify users through the app.</p>
<h2>12. Governing law</h2>
<p>This policy is governed by the laws of the State of Alaska, without regard to conflict-of-law principles.</p>
<h2>13. Contact</h2>
<p>Questions about this policy or your information can be sent to <b>quantumactivist.88@gmail.com</b>.</p>
<p style="color:var(--mute);font-size:13px;margin-top:16px">This policy is provided for transparency about our practices and is not a substitute for independent legal advice.</p>

  busy=true;render();
  apiFetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pass})})
   .then(function(res){return res.json().then(function(body){return {ok:res.ok,body:body}})})
   .then(function(out){
    busy=false;
    if(!out.ok){document.getElementById("err").textContent=out.body.error||"Could not sign you in.";render();return}
    authToken=out.body.token;reg=out.body.user;
    try{localStorage.setItem("hoand_token",authToken);localStorage.setItem("hoand_user",JSON.stringify(reg))}catch(x){}
    mode="signup";cur="feed";render();document.getElementById("main").scrollTop=0;toast("Welcome back, "+reg.name.split(" ")[0]);loadFeed()
   })
   .catch(function(err){busy=false;document.getElementById("err").textContent=apiError(err);render()})}
 else if(t.id=="signout"){reg=null;authToken=null;mode="signedout";try{localStorage.removeItem("hoand_token");localStorage.removeItem("hoand_user")}catch(x){}render()}
 else if(t.id=="contbtn"){mode="signin";render()}
 else if(t.id=="post"){
  var v=document.getElementById("np").value.trim();var pe=document.getElementById("perr");pe.textContent="";
  if(!v){pe.textContent="Write something first.";return}
  if(v.length>130){pe.textContent="Please keep it to 130 characters or fewer.";return}
  if(hasProfanity(v)){pe.textContent="Please remove inappropriate language before posting.";return}
  var postCat=(cat=="All"?"Recommendations":cat);
  busy=true;render();
  apiFetch("/api/posts",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+authToken},body:JSON.stringify({body:v,category:postCat})})
   .then(function(res){return res.json().then(function(b){return {ok:res.ok,body:b}})})
   .then(function(out){
    busy=false;
    if(!out.ok){render();var pe2=document.getElementById("perr");if(pe2)pe2.textContent=out.body.error||"Could not post.";return}
    feed.unshift(out.body);render();toast("Posted")
   })
   .catch(function(e){busy=false;render();var pe2=document.getElementById("perr");if(pe2)pe2.textContent=apiError(e)})}
}
document.addEventListener("change",function(e){
 if(e.target.id=="f_mgr"){document.getElementById("mgrwrap").style.display=e.target.value.indexOf("property")>-1?"block":"none"}
 if(e.target.id=="f_cov_other"){document.getElementById("covotherwrap").style.display=e.target.checked?"block":"none";if(e.target.checked)document.getElementById("f_cov_other_text").focus()}
});
document.addEventListener("input",function(e){
 if(e.target.id=="np"){var c=document.getElementById("npcount");if(c)c.textContent=e.target.value.length+"/130"}
 if(e.target.classList&&e.target.classList.contains("rp")){var pid=e.target.dataset.postid;var c2=document.getElementById("rpcount_"+pid);if(c2)c2.textContent=e.target.value.length+"/130"}
 if(e.target.classList&&e.target.classList.contains("ep")){var eid=e.target.dataset.editpostid;var c3=document.getElementById("epcount_"+eid);if(c3)c3.textContent=e.target.value.length+"/130"}
});
render();
if(reg&&authToken)loadFeed();
</script>
</body>
